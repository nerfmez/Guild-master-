name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Rebuild the standalone game from current src/ on every deployment.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run export
      - run: mkdir -p site && cp play.html site/index.html && touch site/.nojekyll
      # Isolated PR #23 preview; rebuild with player quest and news side drawers.
      # Production homepage remains built from main.
      - uses: actions/checkout@v4
        with:
          ref: fix/quest-news-tablet-promotion-20261012
          path: preview-src
      - run: npm ci && npm run export
        working-directory: preview-src
      - run: mkdir -p site/preview/pr-23 && cp preview-src/play.html site/preview/pr-23/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
