  let reason = questLockReason(state, quest);
  if (!reason && !selectedPolicy) reason = 'แผนเดินทางไม่ถูกต้อง';
  if (!reason && (!Array.isArray(memberIds) || memberIds.length !== 3 || new Set(memberIds).size !== 3 || members.length !== 3)) reason = 'เลือกสมาชิกที่ต่างกัน 3 คน';
  if (!reason && members.some(member => isBusy(state, member.id))) reason = 'สมาชิกบางคนกำลังทำภารกิจ';
  if (!reason && members.some(member => member.energy < 25 || member.injury > 40)) reason = 'สมาชิกต้องพักให้พลังอย่างน้อย 25 และบาดเจ็บไม่เกิน 40';
  if (!reason && getGuildStats(state).activeMissions >= getGuildStats(state).teamCap) reason = 'ทีมภารกิจเต็มแล้ว';
  if (!reason && !canAfford(state, quest.cost)) reason = 'เสบียงไม่เพียงพอ';
  if (!reason && state.missions.some(mission => mission.status === 'active' && mission.questId === quest.id)) reason = 'ภารกิจนี้มีทีมเดินทางอยู่แล้ว';
  return { ok: !reason, reason, power, difficulty: quest.difficulty, readiness, roles, missingRoles,
    duration: Math.round(quest.duration * (selectedPolicy?.duration || 1)), cost: { ...quest.cost },
    energy: Math.round(quest.energy * (selectedPolicy?.energy || 1)),
    verdict: readiness >= 1.25 ? 'พร้อมมาก' : readiness >= 0.95 ? 'พร้อมเดินทาง' : readiness >= 0.72 ? 'เสี่ยงบาดเจ็บ' : 'ควรฝึกและเตรียมอุปกรณ์', policy,
    bondBonus: Math.round(bondBonus * 100), reward: { ...quest.reward },
  };
}

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function canPlaceFacility(state, type, x, y, ignoreId = null) {
  const definition = FACILITIES[type];
  if (!definition) return failure('ไม่พบห้องชนิดนี้');
  if (!Number.isInteger(x) || !Number.isInteger(y)) return failure('ตำแหน่งต้องอยู่บนช่องกริด');
  const area = { x, y, w: definition.w, h: definition.h };
  if (x < 0 || y < 0 || x + area.w > state.grid.width || y + area.h > state.grid.height) return failure('พื้นที่อยู่นอกที่ดินกิลด์');
  if (overlaps(area, { x: 1, y: 1, w: 3, h: 3 })) return failure('เก็บพื้นที่ต้นไม้กลางกิลด์ไว้');
  if (state.facilities.some(room => room.id !== ignoreId && overlaps(area, { ...room, ...getRoomSize(room.type) }))) return failure('ตำแหน่งนี้ทับห้องที่มีอยู่');
  const rooms = state.facilities.filter(room => room.id !== ignoreId);
  const planned = [...rooms, { type, x, y }];
  if (!hasWalkableEntries(state.grid, planned)) return failure('ต้องเว้นทางเดินจากประตูกิลด์ถึงทุกห้องอย่างน้อย 1 ช่อง');
  return success('วางห้องได้');
}

/** Flood-fill only on construction/import, never every animation frame. */
function hasWalkableEntries(grid, rooms) {
  const blocked = new Uint8Array(grid.width * grid.height);
  const at = (x, y) => y * grid.width + x;
  const inGrid = (x, y) => x >= 0 && y >= 0 && x < grid.width && y < grid.height;
  for (let x = 1; x <= 3; x++) for (let y = 1; y <= 3; y++) blocked[at(x, y)] = 1;
  for (const room of rooms) {
    const { w, h } = FACILITIES[room.type];
    for (let x = room.x; x < room.x + w; x++) for (let y = room.y; y < room.y + h; y++) {
      if (inGrid(x, y)) blocked[at(x, y)] = 1;
    }
  }
  // Gate is on the bottom edge, using the nearest open tile to its center.
  const gateX = [...Array(grid.width).keys()].sort((a, b) => Math.abs(a - Math.floor(grid.width / 2)) - Math.abs(b - Math.floor(grid.width / 2))).find(x => !blocked[at(x, grid.height - 1)]);
  if (gateX === undefined) return false;
  const visited = new Uint8Array(blocked.length);
  const queue = [[gateX, grid.height - 1]];
  visited[at(gateX, grid.height - 1)] = 1;
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    for (const [dx, dy] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
      const nx = x + dx, ny = y + dy;
      if (inGrid(nx, ny) && !blocked[at(nx, ny)] && !visited[at(nx, ny)]) {
        visited[at(nx, ny)] = 1; queue.push([nx, ny]);
      }
    }
  }
  return rooms.every(room => {
    const { w, h } = FACILITIES[room.type];
    const entries = [];
    for (let x = room.x; x < room.x + w; x++) entries.push([x, room.y - 1], [x, room.y + h]);
    for (let y = room.y; y < room.y + h; y++) entries.push([room.x - 1, y], [room.x + w, y]);
    return entries.some(([x, y]) => inGrid(x, y) && visited[at(x, y)]);
  });
}

function getUpgradeCost(state, facilityId) {
  const room = typeof facilityId === 'object' ? facilityId : state.facilities.find(facility => facility.id === facilityId);
  if (!room || !FACILITIES[room.type]) return null;
  const base = FACILITIES[room.type].cost;
  return Object.fromEntries(RESOURCE_KEYS.map(key => [key, Math.ceil((base[key] || 0) * (0.7 + room.level * 0.6))]));
}
function getExpansionCost(state) {
  return { gold: 500 + state.landLevel * 350, wood: 18 + state.landLevel * 8, stone: 12 + state.landLevel * 6 };
}

function sendMission(state, payload) {
  const preview = previewMission(state, payload.questId, payload.memberIds, payload.policy || 'balanced');
  if (!preview.ok) return failure(preview.reason);
  const quest = QUEST_BY_ID[payload.questId];
  const party = payload.memberIds.map(id => memberById(state, id));
  const maxHp = party.reduce((sum, member) => sum + getMemberStats(state, member).health, 0);
  transact(state, quest.cost, `เสบียง: ${quest.name}`);
  const mission = { id: `mission-${state.nextId++}`, questId: quest.id, memberIds: [...payload.memberIds],
    duration: preview.duration, progress: 0, policy: payload.policy || 'balanced', status: 'active', event: null,
    power: preview.power, difficulty: quest.difficulty, readiness: preview.readiness, energyCost: preview.energy,
    roles: [...preview.roles],
    risk: nextRandom(state), eventDone: false, decisionBonus: 0, decisionDamage: 0, phase: 'travel',
    combat: { partyHp: maxHp, partyMaxHp: maxHp, enemyHp: quest.difficulty * 5, enemyMaxHp: quest.difficulty * 5,
      enemyName: quest.enemy, wave: 1, lastStrike: 0, log: [] },
  };
  state.missions.push(mission);
  party.forEach(member => { member.task = 'mission'; });
  addLog(state, `ส่ง ${party.map(member => member.name).join(' · ')} ไป${quest.name}`, 'mission');
  return success(`ทีมออกเดินทางไป${quest.name}แล้ว`);
}

function missionEvent(state, mission) {
  const quest = QUEST_BY_ID[mission.questId];
  const flavor = quest.region === 'meadow' ? ['รถเข็นติดหล่ม', 'ทีมเจอชาวบ้านที่รถเข็นติดหล่ม ถ้าช่วยจะช้าลงเล็กน้อย แต่ได้คำแนะนำทางปลอดภัย'] :
    quest.region === 'ruins' ? ['ทางแยกใต้ซากหิน', 'พบประตูเก่าที่มีร่องรอยเวท จะศึกษาอย่างรอบคอบหรือเร่งผ่านไปดี?'] :
      ['สัญญาณไฟในหมอก', 'แสงไฟชี้เส้นทางอีกสาย ทีมเลือกพักสำรวจหรือเดินหน้าตามแผนได้'];
  mission.event = { id: `${mission.id}-event`, title: flavor[0], text: flavor[1], resolved: false,
    choices: [
      { id: 'help', label: 'ช่วยและสำรวจ', description: 'เดินทางเพิ่ม 12 วินาที · ทีมรับมือดีขึ้น · ได้สมุนไพร 2' },
      { id: 'press', label: 'เดินหน้าตามแผน', description: 'จบตามเวลา · ใช้พลังเพิ่ม 4' },
      { id: 'rest', label: 'พักและเช็กอุปกรณ์', description: 'เดินทางเพิ่ม 18 วินาที · เสี่ยงบาดเจ็บลดลง · ใช้สมุนไพร 1' },
    ] };
  addLog(state, `ข่าวจาก${quest.name}: ${flavor[0]} — เลือกได้ระหว่างที่กิลด์ยังทำงาน`, 'event');
}

function chooseEvent(state, payload) {
  const mission = state.missions.find(item => item.id === payload.missionId && item.status === 'active');
  if (!mission || !mission.event || mission.event.resolved) return failure('เหตุการณ์นี้จบไปแล้วหรือยังไม่เกิด');
  const choice = mission.event.choices.find(item => item.id === payload.choiceId);
  if (!choice) return failure('ตัวเลือกไม่ถูกต้อง');
  if (choice.id === 'rest' && state.herb < 1) return failure('ต้องใช้สมุนไพร 1');
  if (choice.id === 'help') { mission.duration += 12; mission.decisionBonus += 0.09; mission.bonusHerb = 2; }
  if (choice.id === 'press') { mission.energyCost += 4; mission.decisionBonus += 0.025; }
  if (choice.id === 'rest') { transact(state, { herb: 1 }, 'สมุนไพรพักระหว่างทาง'); mission.duration += 18; mission.decisionBonus += 0.12; mission.decisionDamage -= 0.08; }
  mission.event.resolved = true;
  mission.event.choiceId = choice.id;
  addLog(state, `ทีม${QUEST_BY_ID[mission.questId].name} เลือก${choice.label}`, 'event');
  return success('ส่งคำแนะนำให้ทีมแล้ว');
}

function updateCombat(mission, quest) {
  const ratio = mission.progress / mission.duration;
  mission.phase = ratio < 0.18 ? 'travel' : ratio < 0.88 ? 'battle' : 'return';
  const battleRatio = clamp((ratio - 0.18) / 0.7, 0, 1);
  const readiness = mission.readiness + mission.decisionBonus;
  const efficiency = clamp(readiness / 0.82, 0, 1.35);
  mission.combat.enemyHp = Math.max(0, Math.round(mission.combat.enemyMaxHp * (1 - battleRatio * efficiency)));
  const roles = mission.roles || [];
  const protection = (roles.includes('tank') ? 0.08 : 0) + (roles.includes('heal') ? 0.14 : 0) + (roles.includes('support') ? 0.07 : 0);
  const damage = clamp(0.72 / Math.max(0.25, readiness) + mission.risk * 0.12 + mission.decisionDamage - protection, 0.12, 1.2);
  mission.combat.partyHp = Math.max(0, Math.round(mission.combat.partyMaxHp * (1 - battleRatio * damage)));
  mission.combat.wave = Math.min(3, 1 + Math.floor(battleRatio * 3));
  const strike = Math.floor(mission.progress / 7);
  if (strike > mission.combat.lastStrike && mission.phase === 'battle') {
    mission.combat.lastStrike = strike;
    const member = mission.memberIds[strike % mission.memberIds.length];
    mission.combat.log.unshift({ memberId: member, text: strike % 3 === 0 ? 'ท่าประสานทีม' : 'โจมตี', damage: Math.round(mission.power / 8) });
    if (mission.combat.log.length > 4) mission.combat.log.length = 4;
  }
}

function resolveMission(state, mission) {
  const quest = QUEST_BY_ID[mission.questId];
  if (mission.event && !mission.event.resolved) {
    mission.event.resolved = true;
    mission.event.choiceId = 'auto';
    addLog(state, `ทีมตัดสินใจตามแผนสมดุลเมื่อไม่มีคำแนะนำเพิ่มเติม`, 'event');
  }
  const readiness = mission.readiness + mission.decisionBonus;
  const won = readiness >= 0.82 && mission.combat.partyHp > 0;
  mission.status = won ? 'completed' : 'failed';
  mission.progress = mission.duration;
  mission.finishedAt = state.elapsed;
  const dailyCount = state.daily.missionCounts[quest.id] || 0;
  state.daily.missionCounts[quest.id] = dailyCount + 1;
  const wasCompleted = Boolean(state.completedQuests[quest.id]);
  if (won) {
    // Repeat contracts pay less; they are renewable work, not unlimited full first-clear bounties.
    const multiplier = !wasCompleted ? 1 : dailyCount >= 3 ? 0.35 : 0.7;
    const rewards = Object.fromEntries(RESOURCE_KEYS.map(key => [key, Math.floor((quest.reward[key] || 0) * multiplier)]));
    rewards.herb += mission.bonusHerb || 0;
    transact(state, rewards, `รางวัล: ${quest.name}`, 1);
    const rep = Math.max(2, Math.round(quest.reward.rep * multiplier * (1 + roomLevel(state, 'reception') * 0.05)));
    state.rep += rep;
    state.completedQuests[quest.id] = (state.completedQuests[quest.id] || 0) + 1;
    state.questRuns[quest.id] = (state.questRuns[quest.id] || 0) + 1;
    mission.result = { success: true, reward: { ...rewards, rep }, title: 'กลับบ้านอย่างปลอดภัย', message: `${quest.name} สำเร็จ ได้ ${rewards.gold} เหรียญ และชื่อเสียง ${rep}` };
    state.goals.firstMission = true;
    improveBonds(state, mission.memberIds, 9);
    if (quest.id === 'hollow') state.story.chapter = Math.max(2, state.story.chapter);
    if (quest.id === 'ruins') state.story.chapter = Math.max(3, state.story.chapter);
    if (quest.id === 'rescue') state.story.chapter = Math.max(4, state.story.chapter);
    if (quest.final) {
      state.story.finished = true;
      state.story.chapter = 5;
      state.story.finishedAt = state.elapsed;
      addLog(state, 'หมอกจางลง ทีมสำรวจกลับถึงบ้าน หัวใจป่าผลิใบใหม่ ชาวเมืองร่วมฉลองใต้ต้นไม้ของกิลด์ — จบฤดูกาลแรกแล้ว เล่นดูแลกิลด์ต่อได้', 'story');
    }
    addLog(state, mission.result.message, 'success');
  } else {
    mission.result = { success: false, reward: {}, title: 'ถอยกลับมาพัก', message: `ทีมถอยจาก${quest.name} ทุกคนกลับมาแล้ว ลองฝึกและเตรียมอุปกรณ์ก่อนออกใหม่` };
    addLog(state, mission.result.message, 'warning');
  }
  mission.memberIds.forEach(id => {
    const member = memberById(state, id);
    member.task = 'rest';
    member.energy = clamp(member.energy - mission.energyCost, 0, 100);
    member.morale = clamp(member.morale + (won ? 7 : -9), 20, 100);
    const injury = won ? Math.max(0, Math.round((1.12 - readiness) * 23 + mission.risk * 3)) : 16 + Math.round(mission.risk * 10);
    const healerReduction = mission.roles?.includes('heal') ? 3 : 0;
    member.injury = clamp(member.injury + Math.max(0, injury - (traitOf(member).injuryReduction || 0) - healerReduction), 0, 100);
    member.missionsDone += won ? 1 : 0;
    addXp(state, member, quest.reward.xp * (won ? 1 : 0.35));
  });
  updateRank(state);
  trimMissions(state);
}

function trimMissions(state) {
  const past = state.missions.filter(mission => mission.status !== 'active');
  if (past.length > 20) {
    const remove = new Set(past.slice(0, past.length - 20).map(mission => mission.id));
    state.missions = state.missions.filter(mission => !remove.has(mission.id));
  }
}

function updateRank(state) {
  let nextRank = RANKS[rankIndex(state.rank) + 1];
  while (nextRank && state.rep >= RANK_REQUIREMENTS[nextRank].rep && (!RANK_REQUIREMENTS[nextRank].quest || state.completedQuests[RANK_REQUIREMENTS[nextRank].quest])) {
    state.rank = nextRank;
    transact(state, { gold: 120 + rankIndex(nextRank) * 45 }, `เงินสนับสนุนกิลด์ระดับ ${nextRank}`, 1);
    addLog(state, `กิลด์เลื่อนเป็นระดับ ${nextRank}! เปิดคำร้องและสิ่งปลูกสร้างใหม่`, 'rank');
    nextRank = RANKS[rankIndex(state.rank) + 1];
  }
}

function dailyUpdate(state) {
  const upkeep = getGuildStats(state).upkeep;
  const paid = Math.min(state.gold, upkeep);
  if (paid) transact(state, { gold: paid }, 'อาหารและดูแลกิลด์ประจำวัน');
  if (paid < upkeep) {
    state.bankruptcyDays += 1;
    state.members.forEach(member => { member.morale = Math.max(30, member.morale - 3); });
    addLog(state, 'เงินดูแลกิลด์ไม่พอ สมาชิกช่วยกันประหยัด รับงานลาดตระเวนฟรีเพื่อฟื้นตัวได้', 'warning');
  } else state.bankruptcyDays = 0;
  const garden = roomLevel(state, 'garden');
  if (garden) transact(state, { herb: garden * 2 }, 'เก็บสมุนไพรจากสวน', 1);
  state.daily = { missionCounts: {}, work: {}, garden: Boolean(garden) };
  if (state.day % 3 === 0) {
    const choices = ['ชาวบ้านฝากขนมปังมาให้กิลด์ สมาชิกทุกคนขวัญดีขึ้น', 'เด็ก ๆ นำภาพวาดทีมกิลด์มาติดผนัง ทุกคนยิ้มให้กัน'];
    const text = choices[Math.floor(nextRandom(state) * choices.length)];
    state.members.forEach(member => { member.morale = clamp(member.morale + 4, 0, 100); });
    addLog(state, text, 'cozy');
  }
}

/** Advance game time. Callers choose speed; tick itself never reads the DOM or timers. */
function tick(state, seconds) {
  if (!finiteNumber(seconds) || seconds <= 0 || state.settings.paused) return state;
  let remaining = Math.min(seconds, 3600);
  while (remaining > 0) {
    const step = Math.min(1, remaining, DAY_LENGTH - state.clock);
    const stats = getGuildStats(state);
    state.elapsed += step;
    state.clock += step;
    const idleMembers = state.members.filter(member => !isBusy(state, member.id));
    const trainingAssignments = new Set(idleMembers.filter(member => member.task === 'train' && member.energy > 12 && member.injury <= 40)
      .sort((a, b) => a.trainingProgress - b.trainingProgress || a.level - b.level)
      .slice(0, stats.trainingSlots).map(member => member.id));
    const restAssignments = new Set(idleMembers.filter(member => member.task === 'rest')
      .sort((a, b) => a.energy - b.energy).slice(0, stats.restSlots).map(member => member.id));
    const healingAssignments = new Set(idleMembers.filter(member => member.injury > 0)
      .sort((a, b) => b.injury - a.injury).slice(0, stats.healingSlots).map(member => member.id));
    for (const member of state.members) {
      member.waitingReason = null;
      if (isBusy(state, member.id)) continue;
      if (member.task === 'train' && trainingAssignments.has(member.id)) {
        const training = bestRoomLevel(state, 'training');
        member.energy = clamp(member.energy - 0.052 * step, 0, 100);
        member.trainingProgress += step;
        addXp(state, member, (0.16 + training * 0.06 + bestRoomLevel(state, 'library') * 0.04 + (traitOf(member).training || 0)) * step);
        if (member.energy <= 12) { member.task = 'rest'; addLog(state, `${member.name} เหนื่อยจากการฝึกและกลับไปพัก`, 'info'); }
      } else if (member.task === 'train') {
        member.waitingReason = 'รอผลัดเข้าห้องฝึก';
        member.energy = clamp(member.energy + 0.07 * step, 0, 100);
      } else if (member.task === 'work') {
        const worked = state.daily.work[member.id] || 0;
        member.trainingProgress += step;
        member.energy = clamp(member.energy - step * 0.015, 0, 100);
        if (member.trainingProgress >= 60 && worked < 2) {
          member.trainingProgress -= 60;
          state.daily.work[member.id] = worked + 1;
          transact(state, { wood: 1, herb: worked === 1 ? 1 : 0 }, `${member.name} ช่วยงานกิลด์`, 1);
        }
        if (member.energy < 25 || (state.daily.work[member.id] || 0) >= 2) member.task = 'rest';
      } else {
        const rate = restAssignments.has(member.id) ? stats.recoveryRate : 0.07;
        if (!restAssignments.has(member.id) && member.energy < 100) member.waitingReason = 'พักที่ลานระหว่างรอเตียง';
        member.energy = clamp(member.energy + (rate + (traitOf(member).recovery || 0)) * step, 0, 100);
        member.morale = clamp(member.morale + (0.006 + bestRoomLevel(state, 'lounge') * 0.006 + (traitOf(member).morale || 0)) * step, 0, 100);
      }
      if (healingAssignments.has(member.id)) member.injury = clamp(member.injury - (0.08 + bestRoomLevel(state, 'infirmary') * 0.06) * step, 0, 100);
      else if (member.task === 'rest') member.injury = clamp(member.injury - 0.025 * step, 0, 100);
    }
    for (const mission of [...state.missions]) {
      if (mission.status !== 'active') continue;
      mission.progress += step;
      const quest = QUEST_BY_ID[mission.questId];
      const hasDecision = quest.story || (quest.id === 'patrol' && !state.completedQuests.patrol);
      if (hasDecision && !mission.eventDone && mission.progress >= mission.duration * 0.4) {
        mission.eventDone = true;
        missionEvent(state, mission);
      }
      updateCombat(mission, quest);
      if (mission.progress >= mission.duration) resolveMission(state, mission);
    }
    if (state.clock >= DAY_LENGTH - 0.00001) {
      state.clock = 0;
      state.day += 1;
      dailyUpdate(state);
    }
    remaining -= step;
  }
  return state;
}

function recruit(state, payload) {
  const content = MEMBER_BY_ID[payload.memberId];
  if (!content || content.starter) return failure('ไม่พบผู้สมัครคนนี้');
  if (memberById(state, content.id)) return failure('สมาชิกอยู่ในกิลด์แล้ว');
  const available = getAvailableRecruits(state).find(member => member.id === content.id);
  if (!available?.available) return failure(available?.reason || 'ยังรับสมาชิกไม่ได้');
  transact(state, { gold: content.cost }, `รับ ${content.name} เข้ากิลด์`);
  state.members.push(createMember(content, Math.max(1, rankIndex(state.rank))));
  state.goals.firstRecruit = true;
  addLog(state, `${content.name} เข้าร่วมกิลด์: ${content.description}`, 'member');
  return success(`${content.name} เข้าร่วมกิลด์แล้ว`);
}

function build(state, payload) {
  const content = FACILITIES[payload.type];
  if (!content) return failure('ไม่พบห้องชนิดนี้');
  if (!hasRank(state, content.unlockRank)) return failure(`ต้องมีกิลด์ระดับ ${content.unlockRank}`);
  if (['reception', 'dispatch'].includes(payload.type) && state.facilities.some(room => room.type === payload.type)) return failure('ห้องชนิดนี้มีได้หนึ่งห้อง');
  const place = canPlaceFacility(state, payload.type, payload.x, payload.y);
  if (!place.ok) return place;
  if (!canAfford(state, content.cost)) return failure('ทรัพยากรสำหรับสร้างห้องไม่เพียงพอ');
  transact(state, content.cost, `สร้าง${content.name}`);
  state.facilities.push({ id: `room-${state.nextId++}`, type: content.id, x: payload.x, y: payload.y, level: 1 });
  addLog(state, `สร้าง${content.name}แล้ว สมาชิกเริ่มเข้าใช้พื้นที่ใหม่`, 'build');
  return success(`สร้าง${content.name}แล้ว`);
}

function move(state, payload) {
  const room = state.facilities.find(item => item.id === payload.facilityId);
  if (!room) return failure('ไม่พบห้อง');
  const place = canPlaceFacility(state, room.type, payload.x, payload.y, room.id);
  if (!place.ok) return place;
  room.x = payload.x; room.y = payload.y;
  return success(`ย้าย${FACILITIES[room.type].name}แล้ว`);
}

function upgrade(state, payload) {
  const room = state.facilities.find(item => item.id === payload.facilityId);
  if (!room) return failure('ไม่พบห้อง');
  if (room.level >= FACILITIES[room.type].maxLevel) return failure('ห้องนี้อยู่ระดับสูงสุดแล้ว');
  const cost = getUpgradeCost(state, room.id);
  if (!canAfford(state, cost)) return failure('ทรัพยากรสำหรับอัปเกรดไม่เพียงพอ');
  transact(state, cost, `อัปเกรด${FACILITIES[room.type].name}`);
  room.level += 1;
  state.goals.firstUpgrade = true;
  addLog(state, `${FACILITIES[room.type].name} เป็นระดับ ${room.level}`, 'build');
  return success(`อัปเกรดห้องเป็นระดับ ${room.level} แล้ว`);
}

function demolish(state, payload) {
  const room = state.facilities.find(item => item.id === payload.facilityId);
  if (!room) return failure('ไม่พบห้อง');
  if (room.type === 'reception') return failure('โถงกิลด์เป็นหัวใจของบ้าน ย้ายได้แต่รื้อไม่ได้');
  if (room.type === 'dorm' && (roomLevel(state, 'dorm') - room.level) * 4 < state.members.length) return failure('สมาชิกจะไม่มีที่พักเพียงพอ');
  if (room.type === 'dispatch' && getGuildStats(state).activeMissions > 1) return failure('รอให้ทีมที่สองกลับก่อนรื้อห้องวางแผน');
  const refund = Object.fromEntries(RESOURCE_KEYS.map(key => [key, Math.floor((FACILITIES[room.type].cost[key] || 0) * 0.4)]));
  transact(state, refund, `รื้อ${FACILITIES[room.type].name} คืนวัสดุบางส่วน`, 1);
  state.facilities = state.facilities.filter(item => item.id !== room.id);
  if (room.type === 'training' && !roomLevel(state, 'training')) state.members.filter(member => member.task === 'train').forEach(member => { member.task = 'rest'; });
  return success('รื้อห้องและคืนวัสดุ 40% แล้ว');
}

function expand(state) {
  if (state.landLevel >= 2) return failure('ขยายที่ดินเต็มแล้ว');
  if (!hasRank(state, state.landLevel === 0 ? 'E' : 'C')) return failure(`ขยายครั้งนี้ต้องมีกิลด์ระดับ ${state.landLevel === 0 ? 'E' : 'C'}`);
  const cost = getExpansionCost(state);
  if (!canAfford(state, cost)) return failure('ทรัพยากรสำหรับขยายที่ดินไม่เพียงพอ');
  transact(state, cost, 'ซื้อที่ดินขยายกิลด์');
  state.landLevel += 1;
  state.grid.width += 6;
  state.grid.height += 4;
  state.goals.firstExpansion = true;
  addLog(state, 'รั้วกิลด์ขยับออกแล้ว มีพื้นที่ใหม่ให้จัดห้องและสวน', 'build');
  return success('ขยายที่ดินกิลด์แล้ว');
}

function craft(state, payload) {
  const item = EQUIPMENT_BY_ID[payload.equipmentId];
  if (!item) return failure('ไม่พบสูตรอุปกรณ์');
  if (!hasRank(state, item.unlockRank)) return failure(`สูตรนี้ต้องมีกิลด์ระดับ ${item.unlockRank}`);
  if (bestRoomLevel(state, 'workshop') < item.workshopLevel) return failure(`ต้องมีโรงซ่อมระดับ ${item.workshopLevel}`);
  if (!canAfford(state, item.cost)) return failure('วัตถุดิบไม่เพียงพอ');
  if ((state.inventory[item.id] || 0) >= 24) return failure('มีอุปกรณ์ชนิดนี้มากเพียงพอแล้ว');
  transact(state, item.cost, `สร้าง${item.name}`);
  state.inventory[item.id] = (state.inventory[item.id] || 0) + 1;
  state.goals.firstCraft = true;
  addLog(state, `โรงซ่อมสร้าง${item.name}แล้ว เลือกสมาชิกเพื่อสวมใส่ได้`, 'craft');
  return success(`สร้าง${item.name}แล้ว`);
}

function equip(state, payload) {
  const member = memberById(state, payload.memberId);
  if (!member) return failure('ไม่พบสมาชิก');
  if (isBusy(state, member.id)) return failure('รอสมาชิกกลับจากภารกิจก่อนเปลี่ยนอุปกรณ์');
  if (payload.equipmentId === null) {
    if (!['weapon', 'accessory'].includes(payload.slot)) return failure('เลือกช่องอุปกรณ์ที่จะถอด');
    const equipped = member.equipment[payload.slot];
    if (equipped) state.inventory[equipped] = (state.inventory[equipped] || 0) + 1;
    member.equipment[payload.slot] = null;
    return success('ถอดอุปกรณ์แล้ว');
  }
  const item = EQUIPMENT_BY_ID[payload.equipmentId];
  if (!item) return failure('ไม่พบอุปกรณ์');
  if (item.classes.length && !item.classes.includes(equipmentBaseClass(member))) return failure('อาชีพนี้ใช้อุปกรณ์ชิ้นนี้ไม่ได้');
  if (!(state.inventory[item.id] > 0)) return failure('ยังไม่มีอุปกรณ์ในคลัง');
  const old = member.equipment[item.slot];
  if (old === item.id) return failure('สวมอุปกรณ์นี้อยู่แล้ว');
  state.inventory[item.id] -= 1;
  if (old) state.inventory[old] = (state.inventory[old] || 0) + 1;
  member.equipment[item.slot] = item.id;
  return success(`${member.name} สวม${item.name}แล้ว`);
}

function specialize(state, payload) {
  const member = memberById(state, payload.memberId);
  if (!member || !JOBS[payload.classId]) return failure('ไม่พบสมาชิกหรืออาชีพ');
  if (isBusy(state, member.id)) return failure('รอสมาชิกกลับก่อนเปลี่ยนอาชีพ');
  if (!getMemberStats(state, member).canSpecialize) return failure('ต้องเป็นอาชีพพื้นฐาน เลเวล 5 และกิลด์ระดับ D');
  if (!JOBS[member.class].next.includes(payload.classId)) return failure('อาชีพนี้ต่อจากสายเดิมไม่ได้');
  if (state.gold < 180) return failure('ต้องใช้ 180 เหรียญ');
  transact(state, { gold: 180 }, `เปลี่ยนอาชีพ${member.name}`);
  member.class = payload.classId;
  addLog(state, `${member.name} ค้นพบเส้นทางของตัวเอง เป็น${JOBS[member.class].name}แล้ว`, 'level');
  return success('เปลี่ยนอาชีพแล้ว');
}

function hostEvent(state, payload) {
  const event = GUILD_EVENTS.find(item => item.id === payload.eventId);
  if (!event) return failure('ไม่พบกิจกรรม');
  if (!roomLevel(state, event.requires)) return failure(`ต้องมี${FACILITIES[event.requires].name}`);
  if ((state.eventCooldowns[event.id] || 0) > state.elapsed) return failure('เพิ่งจัดกิจกรรมนี้ รออีกสักพัก');
  if (!canAfford(state, event.cost)) return failure('วัตถุดิบจัดกิจกรรมไม่เพียงพอ');
  const guests = state.members.filter(member => !isBusy(state, member.id));
  if (!guests.length) return failure('รอให้มีสมาชิกกลับบ้านก่อน');
  transact(state, event.cost, event.name);
  guests.forEach(member => { member.energy = clamp(member.energy + (event.id === 'tea' ? 15 : 30), 0, 100); member.morale = clamp(member.morale + (event.id === 'tea' ? 12 : 20), 0, 100); });
  improveBonds(state, guests.map(member => member.id), event.id === 'tea' ? 5 : 9);
  state.eventCooldowns[event.id] = state.elapsed + event.cooldown;
  addLog(state, `${event.name} — ${guests.map(member => member.name).join(' · ')} ใช้เวลาด้วยกัน`, 'cozy');
  return success(`จัด${event.name}แล้ว`);
}

/** Every rejected command leaves state unchanged. */
function act(state, type, payload = {}) {
  if (!state || typeof state !== 'object') return failure('ไม่พบข้อมูลกิลด์');
  if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return failure('คำสั่งไม่ถูกต้อง');
  switch (type) {
    case 'sendMission': return sendMission(state, payload);
    case 'chooseEvent': return chooseEvent(state, payload);
    case 'recallMission': {
      const mission = state.missions.find(item => item.id === payload.missionId && item.status === 'active');
      if (!mission) return failure('ไม่พบทีมที่กำลังเดินทาง');
      mission.status = 'recalled'; mission.finishedAt = state.elapsed;
      mission.result = { success: false, reward: {}, title: 'กลับก่อนอย่างปลอดภัย', message: 'เรียกทีมกลับแล้ว เสบียงที่ใช้ไปไม่คืน' };
      mission.memberIds.forEach(id => { const member = memberById(state, id); member.task = 'rest'; member.energy = Math.max(0, member.energy - Math.round(mission.energyCost * clamp(mission.progress / mission.duration, 0, 1))); });
      addLog(state, `เรียกทีม${QUEST_BY_ID[mission.questId].name}กลับกิลด์`, 'mission');
      trimMissions(state);
      return success('เรียกทีมกลับแล้ว');
    }
    case 'recruit': return recruit(state, payload);
    case 'setTask': {
      const member = memberById(state, payload.memberId);
      if (!member) return failure('ไม่พบสมาชิก');
      if (isBusy(state, member.id)) return failure('สมาชิกกำลังทำภารกิจ');
      if (!['rest', 'train', 'work'].includes(payload.task)) return failure('งานไม่ถูกต้อง');
      if (payload.task === 'train' && !roomLevel(state, 'training')) return failure('ต้องมีห้องฝึก');
      if (payload.task === 'train' && (member.energy <= 12 || member.injury > 40)) return failure('สมาชิกต้องพักก่อนฝึก');
      member.task = payload.task; member.trainingProgress = 0;
      return success('เปลี่ยนงานสมาชิกแล้ว');
    }
    case 'build': return build(state, payload);
    case 'move': return move(state, payload);
    case 'upgrade': return upgrade(state, payload);
    case 'demolish': return demolish(state, payload);
    case 'expand': return expand(state);
    case 'craft': return craft(state, payload);
    case 'equip': return equip(state, payload);
    case 'specialize': return specialize(state, payload);
    case 'hostEvent': return hostEvent(state, payload);
    case 'setSpeed': {
      if (![1, 2, 4].includes(payload.speed)) return failure('ความเร็วต้องเป็น 1, 2 หรือ 4');
      state.settings.speed = payload.speed; return success('เปลี่ยนความเร็วแล้ว');
    }
    case 'pause': state.settings.paused = Boolean(payload.paused); return success(state.settings.paused ? 'หยุดเวลาแล้ว' : 'เดินเวลาต่อแล้ว');
    case 'setSound': state.settings.sound = Boolean(payload.sound); return success('เปลี่ยนเสียงแล้ว');
    default: return failure('ไม่รู้จักคำสั่งนี้');
  }
}

function validateNumber(object, key, min, max, integer = false) {
  if (!finiteNumber(object[key]) || object[key] < min || object[key] > max || (integer && !Number.isInteger(object[key]))) throw new Error(`ข้อมูลเซฟไม่ถูกต้อง: ${key}`);
}

/** Migrate v1 exports with missing optional bookkeeping, and reject corrupted state. */
function deserializeGame(source) {
  if (typeof source !== 'string' || source.length > 2000000) throw new Error('ไฟล์เซฟใหญ่เกินไปหรือไม่ใช่ข้อความ');
  let data;
  try { data = JSON.parse(source); } catch { throw new Error('อ่านไฟล์เซฟไม่ได้'); }
  if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('รูปแบบเซฟไม่ถูกต้อง');
  const savedChecksum = data.checksum;
  delete data.checksum;
  if (savedChecksum !== undefined && (typeof savedChecksum !== 'string' || savedChecksum !== saveChecksum(JSON.stringify(data)))) throw new Error('ไฟล์เซฟเสียหายหรือข้อมูลถูกเปลี่ยนหลังบันทึก');
  if (![1, SAVE_VERSION].includes(data.version)) throw new Error('เวอร์ชันเซฟนี้ยังไม่รองรับ');
  // Clone through JSON above; imports can never change the caller's previous state.
  const defaults = createGame(data.seed || 123);
  const state = { ...defaults, ...data };
  if (!RANKS.includes(state.rank)) throw new Error('ระดับกิลด์ไม่ถูกต้อง');
  for (const key of RESOURCE_KEYS) validateNumber(state, key, 0, 100000000);
  validateNumber(state, 'rep', 0, 100000000);
  validateNumber(state, 'day', 1, 1000000, true);
  validateNumber(state, 'clock', 0, DAY_LENGTH);
  validateNumber(state, 'elapsed', 0, 1000000000);
  validateNumber(state, 'landLevel', 0, 2, true);
  if (!state.grid || state.grid.width !== 20 + state.landLevel * 6 || state.grid.height !== 16 + state.landLevel * 4) throw new Error('ขนาดที่ดินไม่ตรงกับระดับการขยาย');
  if (!Array.isArray(state.members) || state.members.length < 3 || state.members.length > 12) throw new Error('รายชื่อสมาชิกไม่ถูกต้อง');
  const ids = new Set();
  state.members = state.members.map(member => {
    if (!member || !MEMBER_BY_ID[member.id] || ids.has(member.id) || !JOBS[member.class]) throw new Error('พบสมาชิกซ้ำหรืออาชีพไม่ถูกต้อง');
    ids.add(member.id);
    const content = MEMBER_BY_ID[member.id];
    const baseClass = JOBS[member.class].parent || member.class;
    if (baseClass !== content.class) throw new Error('สายอาชีพสมาชิกไม่ถูกต้อง');
    const normalized = { ...createMember(content), ...member, name: content.name, equipment: { weapon: null, accessory: null, ...member.equipment } };
    validateNumber(normalized, 'level', 1, MAX_LEVEL, true);
    validateNumber(normalized, 'xp', 0, 1000000);
    for (const key of ['energy', 'morale', 'injury']) validateNumber(normalized, key, 0, 100);
    if (!['rest', 'train', 'work', 'mission'].includes(normalized.task)) throw new Error('งานสมาชิกไม่ถูกต้อง');
    for (const slot of ['weapon', 'accessory']) {
      const item = EQUIPMENT_BY_ID[normalized.equipment[slot]];
      if (normalized.equipment[slot] !== null && (!item || item.slot !== slot || (item.classes.length && !item.classes.includes(baseClass)))) throw new Error('อุปกรณ์สมาชิกไม่ถูกต้อง');
    }
    if (!finiteNumber(normalized.trainingProgress) || normalized.trainingProgress < 0) normalized.trainingProgress = 0;
    return normalized;
  });
  if (!Array.isArray(state.facilities) || state.facilities.length < 1 || state.facilities.length > 100) throw new Error('รายชื่อห้องไม่ถูกต้อง');
  const roomIds = new Set();
  for (const room of state.facilities) {
    if (!room || typeof room.id !== 'string' || roomIds.has(room.id) || !FACILITIES[room.type]) throw new Error('ห้องไม่ถูกต้อง');
    roomIds.add(room.id);
    validateNumber(room, 'level', 1, 3, true);
    if (!canPlaceFacility(state, room.type, room.x, room.y, room.id).ok) throw new Error('ห้องในเซฟวางทับกันหรืออยู่นอกพื้นที่');
  }
  if (!state.facilities.some(room => room.type === 'reception') || roomLevel(state, 'dorm') * 4 < state.members.length) throw new Error('ห้องกิลด์หรือห้องพักไม่เพียงพอ');
  if (!Array.isArray(state.missions) || state.missions.length > 22) throw new Error('รายการภารกิจไม่ถูกต้อง');
  const missionIds = new Set(), assigned = new Set();
  for (const mission of state.missions) {
    if (!mission || !QUEST_BY_ID[mission.questId] || typeof mission.id !== 'string' || missionIds.has(mission.id) || !['active', 'completed', 'failed', 'recalled'].includes(mission.status)) throw new Error('ข้อมูลภารกิจไม่ถูกต้อง');
    missionIds.add(mission.id);
    if (!Array.isArray(mission.memberIds) || mission.memberIds.length !== 3 || new Set(mission.memberIds).size !== 3 || mission.memberIds.some(id => !ids.has(id))) throw new Error('สมาชิกภารกิจไม่ถูกต้อง');
    validateNumber(mission, 'duration', 1, 10000);
    validateNumber(mission, 'progress', 0, 10000);
    if (!MISSION_POLICIES[mission.policy]) throw new Error('แผนภารกิจไม่ถูกต้อง');
    if (mission.status === 'active') {
      if (mission.progress >= mission.duration || mission.memberIds.some(id => assigned.has(id))) throw new Error('สมาชิกถูกส่งซ้ำหรือภารกิจจบแล้ว');
      mission.memberIds.forEach(id => assigned.add(id));
      for (const key of ['power', 'difficulty', 'readiness', 'energyCost', 'risk']) validateNumber(mission, key, 0, 100000);
      mission.decisionBonus ??= 0; mission.decisionDamage ??= 0;
      mission.roles = mission.roles || [...new Set(mission.memberIds.map(id => JOBS[memberById(state, id).class].role))];
      if (!Array.isArray(mission.roles) || mission.roles.some(role => !['tank', 'scout', 'magic', 'heal', 'support', 'damage'].includes(role))) throw new Error('บทบาททีมไม่ถูกต้อง');
      validateNumber(mission, 'decisionBonus', 0, 1);
      validateNumber(mission, 'decisionDamage', -1, 1);
      if (!mission.combat || !finiteNumber(mission.combat.partyMaxHp) || !finiteNumber(mission.combat.enemyMaxHp) || mission.combat.partyMaxHp <= 0 || mission.combat.enemyMaxHp <= 0) throw new Error('ข้อมูลต่อสู้ไม่ถูกต้อง');
      mission.combat.log = Array.isArray(mission.combat.log) ? mission.combat.log.slice(0, 4) : [];
      if (mission.event) {
        if (!Array.isArray(mission.event.choices) || mission.event.choices.some(choice => !['help', 'press', 'rest'].includes(choice.id))) throw new Error('ตัวเลือกภารกิจไม่ถูกต้อง');
      }
    }
  }
  state.inventory = { ...(data.inventory || {}) };
  if (!state.inventory || typeof state.inventory !== 'object' || Array.isArray(state.inventory)) throw new Error('คลังอุปกรณ์ไม่ถูกต้อง');
  for (const [id, count] of Object.entries(state.inventory)) if (!EQUIPMENT_BY_ID[id] || !Number.isInteger(count) || count < 0 || count > 1000) throw new Error('จำนวนอุปกรณ์ไม่ถูกต้อง');
  for (const key of ['completedQuests', 'questRuns']) {
    state[key] = { ...(data[key] || {}) };
    for (const [id, count] of Object.entries(state[key])) if (!QUEST_BY_ID[id] || !Number.isInteger(count) || count < 0 || count > 1000000) throw new Error('ประวัติภารกิจไม่ถูกต้อง');
  }
  state.bonds = { ...(data.bonds || {}) };
  for (const [key, value] of Object.entries(state.bonds)) if (!/^\w+:\w+$/.test(key) || !key.split(':').every(id => ids.has(id)) || !finiteNumber(value) || value < 0 || value > 100) throw new Error('ความสัมพันธ์สมาชิกไม่ถูกต้อง');
  state.settings = { ...defaults.settings, ...data.settings };
  if (![1, 2, 4].includes(state.settings.speed)) throw new Error('ความเร็วเซฟไม่ถูกต้อง');
  state.settings.paused = Boolean(state.settings.paused); state.settings.sound = Boolean(state.settings.sound);
  state.goals = { ...defaults.goals, ...data.goals };
  state.story = { ...defaults.story, ...data.story };
  validateNumber(state.story, 'chapter', 1, 5, true);
  state.story.finished = Boolean(state.story.finished);
  if (state.story.finished && !state.completedQuests.heart) throw new Error('บทสรุปเกมไม่ตรงกับประวัติภารกิจ');
  state.daily = { ...defaults.daily, ...data.daily, missionCounts: { ...(data.daily?.missionCounts || {}) }, work: { ...(data.daily?.work || {}) } };

  if(!paused)memory.clock+=Math.max(0,Math.min(.1,now-memory.lastTime));memory.lastTime=now;
  if(memory.strike!==(mission.combat?.lastStrike||0)){memory.strike=mission.combat?.lastStrike||0;memory.strikeAt=memory.clock;}

function playChime(){if(!ui.sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const now=audioContext.currentTime;for(const [i,f] of [523.25,659.25,783.99].entries()){const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(0,now+i*.065);gain.gain.linearRampToValueAtTime(.035,now+i*.065+.012);gain.gain.exponentialRampToValueAtTime(.001,now+i*.065+.23);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now+i*.065);osc.stop(now+i*.065+.24);}}catch{}}
function toast(text,error=false){const node=document.createElement('div');node.className='toast'+(error?' error':' success');node.textContent=text;$('toasts').appendChild(node);setTimeout(()=>node.remove(),5500);while($('toasts').children.length>3)$('toasts').firstChild.remove();}
function save(manual=false){try{const data=serializeGame(state);const previous=localStorage.getItem(saveKey);if(previous){try{deserializeGame(previous);localStorage.setItem(backupKey,previous);}catch{localStorage.setItem(saveKey+':corrupt',previous);}}localStorage.setItem(saveKey,data);saveFailure='';$('save-status').textContent='บันทึกแล้ว · '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});if(manual)toast('บันทึกกิลด์เรียบร้อย');return true;}catch(error){saveFailure='บันทึกอัตโนมัติไม่ได้ กรุณาส่งออกไฟล์เซฟ';$('save-status').textContent='⚠ '+saveFailure;if(manual)toast(saveFailure,true);return false;}}
function dispatch(type,payload={}){try{const result=act(state,type,payload);if(!result.ok){toast(result.message||'ยังทำรายการนี้ไม่ได้',true);return false;}toast(result.message||'เรียบร้อย');playChime();renderer?.setState(state);save();syncUI();return true;}catch(error){console.error(error);toast('ทำรายการไม่สำเร็จ ข้อมูลกิลด์ยังอยู่',true);return false;}}
function activeMissions(){return state.missions.filter(m=>m.status==='active'||m.status==='decision');}
function isAway(id){return activeMissions().some(m=>m.memberIds.includes(id));}
function baseJob(id){const j=JOBS[id];return j?.parent||id;}
function jobName(id){return JOBS[id]?.name||id;}
function roleName(id){return({tank:'ป้องกัน',scout:'สำรวจ',magic:'เวท',heal:'รักษา',damage:'โจมตี',support:'สนับสนุน'})[id]||id;}
function moneyCost(cost={}){return Object.entries(cost).filter(([,v])=>v>0).map(([k,v])=>`${({gold:'G',wood:'ไม้',stone:'หิน',herb:'สมุนไพร'})[k]||k} ${n(v)}`).join(' · ')||'ไม่ใช้เสบียง';}
function canAfford(cost={}){return Object.entries(cost).every(([k,v])=>(state[k]||0)>=v);}
function rankEnough(rank){return RANKS.indexOf(state.rank)>=RANKS.indexOf(rank||'F');}
function inventoryCount(id){const inv=state.inventory||{};if(Array.isArray(inv))return inv.filter(x=>(typeof x==='string'?x:x.equipmentId||x.id)===id).length;return Number(inv[id]||0);}
function item(id){return EQUIPMENT.find(e=>e.id===id);}
function availableCount(id){return inventoryCount(id);}
function pct(value,max=100){return Math.max(0,Math.min(100,100*(Number(value)||0)/max));}
function portrait(member,extra=''){return `<canvas class="portrait" width="64" height="72" data-portrait="${h(member.id)}" ${extra}></canvas>`;}
function itemIcon(id){return `<canvas class="item-icon" width="40" height="40" data-item="${h(id)}"></canvas>`;}
function injectIcons(root=document){root.querySelectorAll('canvas[data-portrait]').forEach(c=>{const m=state.members.find(m=>m.id===c.dataset.portrait)||MEMBERS.find(m=>m.id===c.dataset.portrait);if(m)drawPortrait(c,m,64);});root.querySelectorAll('canvas[data-item]').forEach(c=>drawItemIcon(c,item(c.dataset.item)||c.dataset.item,40));}
function missionRatio(m){return Math.max(0,Math.min(1,(m.progress||0)/(m.duration||1)));}
function missionEventPending(m){return m.event&&!m.event.resolved;}
function taskText(m){if(isAway(m.id))return'ออกภารกิจ';if(m.injury>0)return'พักรักษา';return({rest:'พักฟื้น',train:'ฝึกฝน',work:'ช่วยงาน',auto:'เตรียมพร้อม'})[m.task]||'พักฟื้น';}
function syncHUD(){const stats=getGuildStats(state);$('resources').innerHTML=`<div class="resource"><span class="resource-icon">◈</span><div><small>เงินกิลด์</small><b>${n(state.gold)}</b></div></div><div class="resource"><span class="resource-icon wood">▰</span><div><small>ไม้</small><b>${n(state.wood)}</b></div></div><div class="resource"><span class="resource-icon stone">◆</span><div><small>หิน</small><b>${n(state.stone)}</b></div></div><div class="resource"><span class="resource-icon herb">❧</span><div><small>สมุนไพร</small><b>${n(state.herb)}</b></div></div><div class="resource rank"><span class="rank-seal">${h(state.rank)}</span><div><small>ชื่อเสียง</small><b>${n(state.rep)}</b></div></div>`;
const clock=Number(state.clock)||0;const minute=Math.floor(clock/DAY_LENGTH*1440);const hour=`${String(Math.floor(minute/60)%24).padStart(2,'0')}:${String(minute%60).padStart(2,'0')}`;$('calendar').innerHTML=`<strong>วันที่ ${n(state.day)}</strong><span>☀ ${hour}</span>`;
const chapter=state.story?.chapter||1;$('chapter-label').innerHTML=`<span>CHAPTER ${chapter}</span><b>${['','บ้านหลังเล็ก','เสียงระฆังในป่า','เส้นทางในหมอก','ทุกคนต้องกลับบ้าน','ใต้ร่มใบไม้'][chapter]||'ใต้ร่มใบไม้'}</b>`;
let objective,meta;if(state.story?.finished){objective='บ้านที่ทุกคนได้กลับมา';meta='แคมเปญสำเร็จ · สำรวจและพัฒนากิลด์ต่อได้';}else if(!state.completedQuests?.patrol){objective='ส่งทีมลาดตระเวนครั้งแรก';meta='เลือกคำร้อง → สมาชิก 3 คน → ส่งทีม';}else{objective=stats.nextRank?`เติบโตสู่กิลด์ระดับ ${stats.nextRank}`:'รักษาหัวใจป่า';const q=QUESTS.find(q=>q.id===stats.nextRankQuest);meta=stats.nextRank?`ชื่อเสียง ${n(state.rep)}/${n(stats.nextRankRep)}${q?' · '+q.name:''}`:'รับคำร้องสุดท้ายที่ป่าหมอกจันทร์';}$('objective').innerHTML=`<small>OUR NEXT LITTLE STEP</small><p>${h(objective)}</p><div class="objective-meta">${h(meta)}</div>`;
$('pause-button').textContent=ui.paused?'▶':'Ⅱ';$('pause-button').setAttribute('aria-label',ui.paused?'เดินเวลา':'หยุดเวลา');document.querySelectorAll('[data-speed]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.speed)===ui.speed&&!ui.paused);b.setAttribute('aria-pressed',String(Number(b.dataset.speed)===ui.speed&&!ui.paused));});
const missions=activeMissions();let cards=missions.map(m=>{const q=QUESTS.find(q=>q.id===m.questId);return `<div class="journey-card ${missionEventPending(m)?'ready':''}" role="button" tabindex="0" data-open-mission="${h(m.id)}"><div class="journey-art">${m.memberIds.map(id=>state.members.find(x=>x.id===id)).filter(Boolean).map(m=>portrait(m)).join('')}</div><div class="journey-data"><b>${h(q?.name||m.questId)}</b><small>${missionEventPending(m)?'มีเหตุการณ์ · กดดูทีม':m.phase==='battle'?'กำลังต่อสู้ · กดดูทีม':`กำลังสำรวจ · ${Math.max(0,Math.ceil(m.duration-m.progress))} วินาที`}</small><div class="progress"><i style="width:${pct(missionRatio(m),1)}%"></i></div></div></div>`;});for(let i=missions.length;i<Math.min(2,stats.teamCap);i++)cards.push(`<div class="journey-card empty" role="button" tabindex="0" data-tab="quests">+ จัดทีมออกเดินทาง</div>`);if(stats.teamCap<2)cards.push('<div class="journey-card empty" data-tab="build" role="button" tabindex="0">สร้างห้องวางแผนเพื่อเปิดทีมที่สอง</div>');$('mission-strip').innerHTML=cards.join('');injectIcons($('mission-strip'));
if(ui.buildType||ui.moveId){const label=ui.buildType?FACILITIES[ui.buildType]?.name:'ห้องที่เลือก';$('build-hint').hidden=false;$('build-hint').innerHTML=`${ui.moveId?'ย้าย':'วาง'}${h(label)} · กดพื้นที่สีเขียว <button data-cancel-build>ยกเลิก</button>`;}else $('build-hint').hidden=true;
}
function syncUI(){syncHUD();document.querySelectorAll('.bottom-nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===ui.tab));const headings={quests:'กระดานคำร้อง',members:'เหล่านักผจญภัย',build:'บ้านของกิลด์',workshop:'โรงซ่อมและคราฟต์',journal:'สมุดบันทึกกิลด์'};$('panel-heading').textContent=headings[ui.tab];const scroller=$('panel-content');const top=scroller.scrollTop;const selectValues=new Map([...scroller.querySelectorAll('select[data-equip-select]')].map(e=>[e.dataset.equipSelect,e.value]));scroller.innerHTML=({quests:renderQuests,members:renderMembers,build:renderBuild,workshop:renderWorkshop,journal:renderJournal})[ui.tab]();scroller.scrollTop=top;scroller.querySelectorAll('select[data-equip-select]').forEach(e=>{const old=selectValues.get(e.dataset.equipSelect);if([...e.options].some(o=>o.value===old))e.value=old;});injectIcons(scroller);drawMissionScene();}
function renderQuests(){if(ui.missionId)return renderMission();if(ui.questId)return renderQuestDetail();const quests=getAvailableQuests(state);return `${ui.tutorial&&!state.completedQuests?.patrol?`<div class="help-card"><b>ยินดีต้อนรับสู่บ้านหลังเล็ก</b><br>เริ่มจากคำร้องลาดตระเวน เลือกฟินน์กับเพื่อนร่วมทีมอีกสองคน แล้วส่งออกไป ระหว่างรอคุณจัดห้องและเตรียมคนที่อยู่บ้านได้<button data-dismiss-tutorial>เข้าใจแล้ว</button></div>`:''}<p class="panel-intro">ทุกการเดินทาง เริ่มจากบ้านที่อบอุ่น<br>เลือกคนให้ตรงกับงาน แล้วเตรียมทีมให้พร้อม</p><div class="region-tabs">${REGIONS.map(r=>`<button data-region="${r.id}" class="${ui.region===r.id?'active':''}">${h(r.name)}</button>`).join('')}</div>${quests.filter(q=>q.region===ui.region).map(q=>`<button class="quest-card ${q.locked?'locked':''}" data-quest="${q.id}"><div class="quest-top"><b>${h(q.name)}</b><span class="badge ${q.locked?'locked':q.story?'story':''}">${q.locked?'ระดับ '+q.rank:q.final?'บทสุดท้าย':q.story?'เรื่องราว':'คำร้อง'}</span></div><p>${h(q.locked?q.lockReason:q.description)}</p><div class="quest-meta"><span>◷ ${Math.ceil(q.duration/60)} นาที · ${q.tags.map(roleName).join(' / ')}</span><span>${n(q.reward.gold)} G <span class="quest-arrow">›</span></span></div></button>`).join('')}<p class="tiny-note">เวลาบนคำร้องเป็นเวลาในเกม ปุ่ม ×2 / ×4 ช่วยเร่งได้ งานพื้นฐานไม่ใช้เงินเตรียมทีม</p>`;}
function renderQuestDetail(){const q=getAvailableQuests(state).find(q=>q.id===ui.questId);if(!q){ui.questId=null;return renderQuests();}const preview=previewMission(state,q.id,[...ui.selected],ui.policy);return `<button class="back-button" data-back>‹ กลับกระดานคำร้อง</button><div class="quest-illustration"><span>${h(REGIONS.find(r=>r.id===q.region)?.name)}</span></div><h2 class="detail-title">${h(q.name)}</h2><p class="detail-copy">${h(q.description)}</p><div class="tag-list">${q.tags.map(tag=>`<span>เหมาะกับ${h(roleName(tag))}</span>`).join('')}${q.story?'<span>เหตุการณ์ระหว่างทาง</span>':''}</div><div class="rewards">${Object.entries(q.reward).filter(([k])=>k!=='xp').map(([k,v])=>`<span class="reward">${h(({gold:'เงิน',rep:'ชื่อเสียง',wood:'ไม้',stone:'หิน',herb:'สมุนไพร'})[k])} +${n(v)}</span>`).join('')}</div>${q.locked?`<div class="readiness warn">${h(q.lockReason)}</div>`:''}<div class="section-title">จัดทีมเดินทาง<small>${ui.selected.size}/3 คน</small></div><div class="team-grid">${state.members.map(m=>`<button class="team-pick ${ui.selected.has(m.id)?'selected':''} ${isAway(m.id)||m.injury>40?'unavailable':''}" data-pick-member="${h(m.id)}" aria-pressed="${ui.selected.has(m.id)}" ${isAway(m.id)||m.injury>40?'disabled':''}>${portrait(m)}<b>${h(m.name)}</b><small>${h(jobName(m.class))} · Lv.${m.level}<br>${isAway(m.id)?'ออกภารกิจ':m.injury>40?'ต้องรักษา':'พลัง '+n(m.energy)}</small><div class="mini-energy"><i style="width:${pct(m.energy)}%"></i></div></button>`).join('')}</div><div class="section-title">แนวทางเดินทาง</div><div class="segmented">${Object.entries(MISSION_POLICIES).map(([id,p])=>`<button data-policy="${id}" class="${ui.policy===id?'active':''}">${h(p.name)}</button>`).join('')}</div><div class="readiness ${!preview.ok||preview.readiness<1?'warn':''}">${h(ui.selected.size?(preview.ok?preview.verdict:preview.reason||'ตรวจความพร้อมทีม'):'เลือกสมาชิกให้ครบสามคน')}<p>${ui.selected.size?`พลังทีม ${n(preview.power)} / ความยาก ${n(preview.difficulty)} · function renderMission(){const m=state.missions.find(m=>m.id===ui.missionId);if(!m){ui.missionId=null;return renderQuests();}const q=QUESTS.find(q=>q.id===m.questId);const ongoing=m.status==='active'||m.status==='decision';return `<button class="back-button" data-back>‹ กลับกระดานคำร้อง</button><h2 class="detail-title">${h(q?.name||m.questId)}</h2><p class="detail-copy">${h(q?.description)}</p><canvas id="mission-scene" width="280" height="145" style="width:100%;height:auto;image-rendering:pixelated;border-radius:7px;border:1px solid #ded8c1"></canvas><div class="mission-detail-members">${m.memberIds.map(id=>state.members.find(x=>x.id===id)).filter(Boolean).map(member=>portrait(member)).join('')}</div><div class="section-title">${ongoing?'ความคืบหน้าการเดินทาง':m.status==='completed'?'ทีมกลับถึงบ้านแล้ว':m.status==='recalled'?'เรียกทีมกลับแล้ว':'ทีมถอยกลับมาพัก'}<small>${n(missionRatio(m)*100)}%</small></div><div class="progress"><i style="width:${pct(missionRatio(m),1)}%"></i></div>${missionEventPending(m)?`<div class="event-card" style="margin-top:15px"><h3>${h(m.event.title)}</h3><p>${h(m.event.text)}</p>${m.event.choices.map(c=>`<button data-event-choice="${h(c.id)}" data-mission="${h(m.id)}">${h(c.label)}<small>${h(c.description||'')}</small></button>`).join('')}</div>`:`<p class="detail-copy">${h(ongoing?(m.phase==='battle'?`พบ${q?.enemy} · การเตรียมทีมและอุปกรณ์มีผลกับการต่อสู้`:'สมาชิกกำลังสำรวจเส้นทาง คุณกลับไปจัดกิลด์ระหว่างรอได้'):(m.result?.message||'บันทึกการเดินทางอยู่ในสมุดกิลด์'))}</p>`}${ongoing?`<button class="secondary full-button" data-recall="${h(m.id)}">เรียกทีมกลับก่อน</button><p class="tiny-note">หยุดความเสี่ยงและกลับมาพัก เสบียงที่ใช้ไปไม่คืน และยังไม่ได้รางวัลคำร้อง</p>`:''}`;}
function renderMembers(){const stats=getGuildStats(state);if(ui.memberId)return renderMemberDetail();const recruits=getAvailableRecruits(state);return `<p class="panel-intro">สมาชิก ${stats.memberCount}/${stats.memberCap} คน · บ้านที่ทุกคนมีที่พัก<br>ฝึก พัก หรือช่วยงาน เลือกตารางให้เหมาะกับทีม</p>${state.members.map(m=>`<button class="member-card" data-member="${h(m.id)}">${portrait(m)}<div class="member-data"><b>${h(m.name)}</b><small>${h(jobName(m.class))} · Lv.${m.level} · ${h(taskText(m))}</small><div class="progress"><i style="width:${pct(m.energy)}%"></i></div></div><span class="member-tag">${n(m.energy)} / 100</span></button>`).join('')}<div class="section-title">ผู้สมัครเข้ากิลด์<small>ชื่อเสียงช่วยให้คนใหม่รู้จักเรา</small></div>${recruits.length?recruits.map(m=>`<div class="recruit-card"><div class="recruit-card-top">${portrait(m)}<div><b>${h(m.name)}</b><small>${h(jobName(m.class))} · ${h(m.trait)}</small></div></div><p class="tiny-note">${h(m.description)}</p><button data-recruit="${h(m.id)}" ${!m.available?'disabled':''}>${m.available?'รับเข้ากิลด์ · '+n(m.cost)+' G':h(m.reason||'ยังไม่เปิดรับ')}</button></div>`).join(''):'<p class="tiny-note">สมาชิกทุกคนเข้ากิลด์แล้ว</p>'}`;}
function renderMemberDetail(){const m=state.members.find(m=>m.id===ui.memberId);if(!m){ui.memberId=null;return renderMembers();}const def=MEMBERS.find(x=>x.id===m.id),stats=getMemberStats(state,m);const bondList=Object.entries(state.bonds||{}).filter(([key])=>key.split('|').includes(m.id)||key.split(':').includes(m.id)||key.split('-').includes(m.id));const next=JOBS[m.class]?.next||[];return `<button class="back-button" data-back>‹ สมาชิกกิลด์</button><div class="member-hero">${portrait(m)}<div><h2>${h(m.name)}</h2><p>${h(jobName(m.class))} · Lv.${m.level}</p><p>${h(taskText(m))}</p>${stats.waitingReason?'<p>'+h(stats.waitingReason)+'</p>':''}</div></div><div class="trait">${h(def?.trait||m.trait)} · ${h(def?.description||m.description)}</div><div class="stat-grid"><div class="stat-box">พลังต่อสู้<b>${n(stats.power)}</b></div><div class="stat-box">พลังพร้อมออกงาน<b>${n(m.energy)} / 100</b></div><div class="stat-box">ขวัญกำลังใจ<b>${n(m.morale)} / 100</b></div><div class="stat-box">ความคืบหน้าเลเวล<b>${n(m.xp)} XP</b></div></div>${m.injury>0?`<div class="inline-tip">กำลังรักษาบาดเจ็บ · อาการบาดเจ็บ ${n(m.injury)}/100</div>`:''}<div class="section-title">ตารางที่กิลด์</div><div class="segmented">${[['rest','พักฟื้น'],['train','ฝึกฝน'],['work','ช่วยงาน']].map(([id,label])=>`<button data-task="${id}" data-member-id="${h(m.id)}" class="${m.task===id?'active':''}" ${isAway(m.id)?'disabled':''}>${label}</button>`).join('')}</div><p class="tiny-note">ฝึกใช้พลังและเพิ่ม XP · ช่วยงานได้ไม้และสมุนไพร · เมื่อเหนื่อยจะพักก่อน</p><div class="section-title">อุปกรณ์ประจำตัว</div>${['weapon','accessory'].map(slot=>{const e=item(m.equipment?.[slot]);return`<div class="equipment-row">${e?itemIcon(e.id):'<span class="build-icon" style="width:28px;height:28px;font-size:14px">'+(slot==='weapon'?'⚔':'✧')+'</span>'}<span>${h(e?.name||(slot==='weapon'?'ยังไม่มีอาวุธ':'ยังไม่มีเครื่องราง'))}<small>${e?'พลัง +'+e.power:(slot==='weapon'?'อาวุธ':'เครื่องประดับ')}</small></span>${e?`<button data-unequip="${slot}" data-member-id="${h(m.id)}" ${isAway(m.id)?'disabled':''} style="font-size:9px;padding:3px 6px">ถอด</button>`:''}</div>`;}).join('')}<button class="secondary full-button" data-tab="workshop">คราฟต์และเลือกอุปกรณ์ →</button>${next.length?`<div class="section-title">เลือกสายเชี่ยวชาญ<small>Lv.5 และกิลด์ D</small></div>${next.map(id=>`<button class="build-card" data-specialize="${id}" data-member-id="${h(m.id)}" ${m.level<5||!rankEnough('D')||isAway(m.id)?'disabled':''}><span class="build-icon">${h(JOBS[id].icon)}</span><div class="build-info"><b>${h(JOBS[id].name)}</b><p>บทบาท${h(roleName(JOBS[id].role))} · พลังพื้นฐาน ${JOBS[id].power}</p></div></button>`).join('')}`:''}${bondList.length?`<div class="section-title">เพื่อนร่วมทาง</div>${bondList.slice(0,5).map(([key,value])=>{const ids=key.split(/[|:\-]/);const names=ids.map(id=>state.members.find(x=>x.id===id)?.name||id);return`<div class="bond-row">${h(names.join(' & '))}<span>ความไว้ใจ ${n(typeof value==='number'?value:value.value||value.level||0)}</span></div>`;}).join('')}`:''}`;}
function renderBuild(){if(ui.facilityId){const f=state.facilities.find(f=>f.id===ui.facilityId);if(f){const def=FACILITIES[f.type];return `<button class="back-button" data-back>‹ ห้องและที่ดิน</button><h2 class="detail-title">${h(def.name)}</h2><p class="detail-copy">${h(def.description)}</p><div class="stat-grid"><div class="stat-box">ระดับห้อง<b>${f.level} / ${def.maxLevel||3}</b></div><div class="stat-box">พื้นที่<b>${def.w} × ${def.h} ช่อง</b></div></div><button class="primary full-button" data-upgrade="${h(f.id)}" ${f.level>=(def.maxLevel||3)?'disabled':''}>${f.level>=(def.maxLevel||3)?'ห้องระดับสูงสุดแล้ว':'อัปเกรดห้อง →'}</button><p class="tiny-note">${f.level<(def.maxLevel||3)?h(moneyCost(getUpgradeCost(state,f.id))):'โบนัสห้องถึงระดับสูงสุดแล้ว'}</p><div class="facility-actions"><button data-move="${h(f.id)}">ย้ายห้อง</button><button class="danger" data-demolish="${h(f.id)}">รื้อห้อง</button></div><div class="inline-tip">วางห้องให้อยู่ในพื้นที่ของกิลด์และไม่ทับห้องอื่น การย้ายไม่เสียค่าใช้จ่าย</div>`;}}
const stats=getGuildStats(state);return `<p class="panel-intro">เลือกห้อง แล้วกดวางในพื้นที่ว่างของกิลด์<br>กิลด์ชั้นเดียว ขยายออกด้านข้างได้</p>${Object.entries(FACILITIES).map(([type,f])=>`<button class="build-card ${ui.buildType===type?'ui-pulse':''}" data-build="${type}" ${!rankEnough(f.unlockRank)||!canAfford(f.cost)||(['reception','dispatch'].includes(type)&&state.facilities.some(room=>room.type===type))?'disabled':''}><span class="build-icon">${({reception:'▤',dorm:'▱',infirmary:'✚',kitchen:'♨',training:'⚔',workshop:'⚒',garden:'❧',library:'▥',lounge:'♡',dispatch:'⚑'})[type]||'⌂'}</span><div class="build-info"><b>${h(f.name)} ${['reception','dispatch'].includes(type)&&state.facilities.some(room=>room.type===type)?'· มีแล้ว':rankEnough(f.unlockRank)?'':'· ระดับ '+f.unlockRank}</b><p>${h(f.description)}</p><div class="build-cost">${h(moneyCost(f.cost))} · ${f.w}×${f.h}</div></div></button>`).join('')}<div class="expansion-card"><b>ซื้อที่ดินรอบบ้าน</b><p>พื้นที่ปัจจุบัน ${state.grid.width}×${state.grid.height} ช่อง · ขยายแล้ววางห้องใหม่ได้<br>สมาชิก ${stats.memberCount}/${stats.memberCap} คน · พักเร็ว ${stats.restSlots} คน · ฝึก ${stats.trainingSlots} คน · รักษา ${stats.healingSlots} คน</p><p class="build-cost">${state.landLevel<2?h(moneyCost(getExpansionCost(state))):'ขยายเต็มพื้นที่แล้ว'}</p><button class="primary" data-expand ${state.landLevel>=2||!rankEnough(state.landLevel===0?'E':'C')||!canAfford(getExpansionCost(state))?'disabled':''}>${state.landLevel>=2?'ขยายเต็มแล้ว':!rankEnough(state.landLevel===0?'E':'C')?'ต้องการกิลด์ '+(state.landLevel===0?'E':'C'):'ขยายที่ดิน →'}</button></div><div class="section-title">ห้องที่สร้างแล้ว<small>กดห้องในฉากเพื่อจัดการได้</small></div>${state.facilities.map(f=>`<button class="equipment-row" style="width:100%;text-align:left" data-facility="${h(f.id)}"><span>${h(FACILITIES[f.type]?.name)}</span><small>Lv.${f.level} ›</small></button>`).join('')}`;}
function renderWorkshop(){const maxWorkshop=Math.max(0,...state.facilities.filter(f=>f.type==='workshop').map(f=>f.level));return `<p class="panel-intro">ของจากการเดินทาง กลายเป็นอุปกรณ์ชิ้นใหม่<br>คราฟต์ก่อน แล้วเลือกสมาชิกเพื่อสวมใส่</p>${EQUIPMENT.map(e=>{const eligible=state.members.filter(m=>!isAway(m.id)&&(!e.classes.length||e.classes.includes(baseJob(m.class))));const count=availableCount(e.id);const locked=!rankEnough(e.unlockRank)||maxWorkshop<e.workshopLevel;return `<div class="item-card"><div class="item-top">${itemIcon(e.id)}<div><b>${h(e.name)}</b><small>${e.slot==='weapon'?'อาวุธ':'เครื่องราง'} · พลัง +${e.power} · ในคลัง ${count}</small></div></div><p>${h(e.description)}${e.classes.length?' · '+e.classes.map(jobName).join('/'):' · ทุกอาชีพ'}</p><div class="build-cost">${h(moneyCost(e.cost))}</div><div class="item-actions" style="margin-top:8px"><button class="${locked?'secondary':'primary'}" data-craft="${e.id}" ${locked||!canAfford(e.cost)?'disabled':''}>${locked?'ต้องการกิลด์ '+e.unlockRank+' / โรงซ่อม '+e.workshopLevel:'คราฟต์'}</button>${count>0&&eligible.length?`<select aria-label="สมาชิกที่สวม ${h(e.name)}" data-equip-select="${e.id}">${eligible.map(m=>`<option value="${h(m.id)}">${h(m.name)}</option>`).join('')}</select><button data-equip="${e.id}">ใส่</button>`:''}</div></div>`;}).join('')}`;}
function renderJournal(){const stats=getGuildStats(state);const nextRequirement=RANK_REQUIREMENTS[stats.nextRank];const nextQuest=QUESTS.find(q=>q.id===nextRequirement?.quest);let goals=state.story?.finished?['ช่วยทีมสำรวจกลับบ้าน','รักษาหัวใจป่า','มีบ้านให้ทุกคนกลับมา']:[stats.nextRank?`ชื่อเสียง ${n(state.rep)} / ${n(nextRequirement?.rep||0)}`:'กิลด์ระดับ A',nextQuest?`สำเร็จคำร้อง ${nextQuest.name}`:'สำเร็จคำร้องรักษาหัวใจป่า'];const ledger=(state.ledger||[]).slice(0,8);return `${state.story?.finished?'<div class="finished-banner"><b>ทุกคนกลับบ้านแล้ว ❧</b><br>กิลด์ใบอ่อนคืนแสงให้ป่าได้สำเร็จ ขอบคุณที่ดูแลนักผจญภัยทุกคน คุณเล่นต่อ รับคนใหม่ และตกแต่งกิลด์ได้</div>':''}<div class="chapter-card"><small>OUR GUILD STORY · CHAPTER ${state.story?.chapter||1}</small><h2>${state.story?.finished?'บ้านใต้ร่มใบไม้':stats.nextRank?'ก้าวต่อไป · กิลด์ระดับ '+stats.nextRank:'รักษาหัวใจป่า'}</h2><p>จากบ้านเล็กท้ายเมือง สู่สถานที่ที่ผู้คนฝากความหวัง</p><ul>${goals.map(goal=>`<li>${h(goal)}</li>`).join('')}</ul><div class="progress"><i style="width:${pct(stats.rankProgress,1)}%"></i></div></div><div class="stat-grid"><div class="stat-box">คำร้องที่สำเร็จ<b>${n(Object.values(state.completedQuests||{}).reduce((s,v)=>s+Number(v||0),0))} งาน</b></div><div class="stat-box">ค่าดูแลต่อวัน<b>${n(stats.upkeep)} G</b></div><div class="stat-box">รายรับวันนี้<b>${n(stats.incomeToday)} G</b></div><div class="stat-box">รายจ่ายวันนี้<b>${n(stats.expenseToday)} G</b></div></div><div class="section-title">ช่วงเวลาดี ๆ ในกิลด์</div>${GUILD_EVENTS.map(e=>`<div class="item-card"><b style="font-size:12px">${h(e.name)}</b><p>${h(e.description)}</p><div class="build-cost">${h(moneyCost(e.cost))}</div><button class="secondary full-button" data-host-event="${e.id}" ${!state.facilities.some(f=>f.type===e.requires)||!canAfford(e.cost)?'disabled':''}>${state.facilities.some(f=>f.type===e.requires)?'จัดกิจกรรม':'ต้องมี'+FACILITIES[e.requires].name}</button></div>`).join('')}<div class="section-title">บัญชีล่าสุด</div>${ledger.length?ledger.map(entry=>{const amount=Number(entry.amount||entry.gold||0);return`<div class="ledger-row"><span>${h(entry.label||entry.text||entry.reason||entry.type)} · วันที่ ${entry.day}</span><b class="${amount<0?'negative':''}">${amount>0?'+':''}${n(amount)} G</b></div>`;}).join(''):'<p class="tiny-note">เริ่มรับคำร้องเพื่อเพิ่มรายรับของกิลด์</p>'}<div class="section-title">เรื่องราวที่เกิดขึ้น</div>${(state.log||[]).slice(0,14).map(entry=>`<div class="log-entry"><small>วันที่ ${h(entry.day)} · GUILD MEMORY</small>${h(entry.text)}</div>`).join('')}`;}
function navigate(tab){ui.tab=tab;ui.questId=null;ui.memberId=null;ui.facilityId=null;ui.missionId=null;ui.selected.clear();syncUI();$('panel-content').scrollTop=0;}
function cancelBuild(){ui.buildType=null;ui.moveId=null;renderer?.setBuildMode(null);renderer?.setMoveMode(null);syncHUD();}
function onSceneSelect(selection){if(selection.kind==='build'&&ui.buildType){if(dispatch('build',{type:ui.buildType,x:selection.x,y:selection.y})){cancelBuild();syncUI();}}else if(selection.kind==='move'&&ui.moveId){if(dispatch('move',{facilityId:ui.moveId,x:selection.x,y:selection.y})){cancelBuild();syncUI();}}else if(selection.kind==='member'){cancelBuild();navigate('members');ui.memberId=selection.id;syncUI();}else if(selection.kind==='facility'){cancelBuild();navigate('build');ui.facilityId=selection.id;syncUI();}}
let confirmCallback;
function confirmAction(title,message,callback){$('confirm-title').textContent=title;$('confirm-message').textContent=message;confirmCallback=callback;$('confirm-dialog').showModal();}
$('confirm-cancel').addEventListener('click',()=>{$('confirm-dialog').close();confirmCallback=null;});$('confirm-ok').addEventListener('click',()=>{$('confirm-dialog').close();const callback=confirmCallback;confirmCallback=null;callback?.();});
function openSettings(){$('settings-content').innerHTML=`<h2>บ้านหลังนี้ บันทึกไว้ได้</h2><p>เซฟอยู่ในเบราว์เซอร์ของเครื่องนี้ ส่งออกไฟล์เพื่อสำรองหรือย้ายไปเครื่องอื่นได้</p>${saveFailure?`<div class="save-warning">${h(saveFailure)}</div>`:''}<div class="settings-row"><button class="primary" data-save-now>บันทึกตอนนี้</button><button data-export-save>ส่งออกเซฟ</button><button data-import-save>นำเข้าเซฟ</button></div><div class="settings-divider"></div><h3>เสียงและการควบคุม</h3><div class="settings-row"><button data-toggle-sound>${ui.sound?'♪ เสียงเปิด':'♪ เสียงปิด'}</button></div><p>ลากฉากเพื่อเลื่อน · ใช้ + / − หรือสองนิ้วเพื่อซูม<br>กดห้องเพื่อย้ายหรืออัปเกรด · กดคนเพื่อดูรายละเอียด<br>Space หยุดเวลา · 1 / 2 / 4 เร่งเวลา · Esc ยกเลิกการวางห้อง</p><div class="settings-divider"></div><h3>เริ่มการเดินทางใหม่</h3><p>เริ่มกิลด์ใหม่จะเขียนทับเซฟของเครื่องนี้ ส่งออกเซฟเดิมไว้ก่อนหากต้องการเก็บ</p><button class="danger" data-new-game>เริ่มกิลด์ใหม่</button><p class="tiny-note">เวอร์ชันแรกที่เล่นได้ · ความยาวแคมเปญยังอยู่ระหว่างปรับสมดุล</p>`;$('settings-dialog').showModal();}
$('settings-button').addEventListener('click',openSettings);
$('import-file').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;if(file.size>2000000){toast('ไฟล์เซฟใหญ่เกินไป',true);return;}try{const imported=deserializeGame(await file.text());$('settings-dialog').close();confirmAction('ใช้เซฟจากไฟล์นี้?',`กิลด์ระดับ ${imported.rank} วันที่ ${imported.day} · ข้อมูลปัจจุบันจะถูกแทนที่`,()=>{state=imported;state.settings.paused=false;ui={...ui,tab:'quests',region:'meadow',questId:null,memberId:null,missionId:null,facilityId:null,selected:new Set(),paused:false,speed:state.settings.speed||1,sound:!!state.settings.sound,tutorial:!state.completedQuests?.patrol};cancelBuild();renderer?.setState(state);renderer?.resetView?.();seenLog=state.log[0];save();syncUI();toast('นำเข้ากิลด์เรียบร้อย');});}catch(error){toast('ไฟล์เซฟไม่ถูกต้องหรือไม่รองรับ ข้อมูลปัจจุบันยังอยู่',true);}});
document.addEventListener('click',event=>{const b=event.target.closest('button,[role="button"]');if(!b||b.disabled)return;const d=b.dataset;if(d.tab){navigate(d.tab);return;}if(d.region){ui.region=d.region;syncUI();return;}if(d.quest){ui.questId=d.quest;ui.missionId=null;ui.selected.clear();syncUI();return;}if(d.member){ui.memberId=d.member;ui.tab='members';syncUI();return;}if(d.facility){ui.facilityId=d.facility;ui.tab='build';syncUI();return;}if(d.openMission){ui.tab='quests';ui.missionId=d.openMission;ui.questId=null;syncUI();return;}if('back'in d){ui.questId=null;ui.memberId=null;ui.facilityId=null;ui.missionId=null;ui.selected.clear();syncUI();return;}if(d.pickMember){if(ui.selected.has(d.pickMember))ui.selected.delete(d.pickMember);else if(ui.selected.size<3)ui.selected.add(d.pickMember);else toast('หนึ่งทีมจัดได้ไม่เกินสามคน',true);syncUI();return;}if(d.policy){ui.policy=d.policy;syncUI();return;}if('sendMission'in d){if(dispatch('sendMission',{questId:ui.questId,memberIds:[...ui.selected],policy:ui.policy})){ui.missionId=activeMissions().at(-1)?.id;ui.questId=null;ui.selected.clear();syncUI();}return;}if(d.eventChoice){dispatch('chooseEvent',{missionId:d.mission,choiceId:d.eventChoice});return;}if(d.recall){confirmAction('เรียกทีมกลับ?', 'ทีมจะหยุดภารกิจและกลับมาพักที่กิลด์',()=>dispatch('recallMission',{missionId:d.recall}));return;}if(d.recruit){dispatch('recruit',{memberId:d.recruit});return;}if(d.task){dispatch('setTask',{memberId:d.memberId,task:d.task});return;}if(d.build){ui.buildType=d.build;ui.moveId=null;ui.facilityId=null;renderer?.setMoveMode(null);renderer?.setBuildMode(d.build);syncUI();return;}if('cancelBuild'in d){cancelBuild();return;}if(d.move){ui.moveId=d.move;ui.buildType=null;renderer?.setBuildMode(null);renderer?.setMoveMode(d.move);syncHUD();return;}if(d.upgrade){const f=state.facilities.find(f=>f.id===d.upgrade);const def=FACILITIES[f.type];const cost=getUpgradeCost(state,f.id);confirmAction('อัปเกรด'+def.name,`ปรับปรุงเป็นระดับ ${f.level+1} · ${moneyCost(cost)}`,()=>dispatch('upgrade',{facilityId:d.upgrade}));return;}if(d.demolish){confirmAction('รื้อห้องนี้?', 'พื้นที่จะว่างให้สร้างใหม่ ได้ทรัพยากรคืนบางส่วน ความจุและโบนัสห้องจะลดลง',()=>{if(dispatch('demolish',{facilityId:d.demolish})){ui.facilityId=null;syncUI();}});return;}if('expand'in d){confirmAction('ขยายที่ดินกิลด์?',`${state.grid.width+6}×${state.grid.height+4} ช่อง · ${moneyCost(getExpansionCost(state))}`,()=>dispatch('expand'));return;}if(d.craft){dispatch('craft',{equipmentId:d.craft});return;}if(d.equip){const select=document.querySelector(`[data-equip-select="${CSS.escape(d.equip)}"]`);if(select)dispatch('equip',{memberId:select.value,equipmentId:d.equip});return;}if(d.unequip){dispatch('equip',{memberId:d.memberId,equipmentId:null,slot:d.unequip});return;}if(d.specialize){confirmAction('เลือกสาย'+JOBS[d.specialize].name+'?', 'สมาชิกจะเชี่ยวชาญสายนี้ การเลือกสายเป็นการตัดสินใจถาวรของรอบเล่น',()=>dispatch('specialize',{memberId:d.memberId,classId:d.specialize}));return;}if(d.hostEvent){dispatch('hostEvent',{eventId:d.hostEvent});return;}if(d.speed){ui.speed=Number(d.speed);state.settings.speed=ui.speed;ui.paused=false;syncHUD();save();return;}if('dismissTutorial'in d){ui.tutorial=false;syncUI();return;}if('saveNow'in d){save(true);return;}if('exportSave'in d){const blob=new Blob([serializeGame(state)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`little-leaf-guild-day-${state.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('ส่งออกไฟล์เซฟแล้ว');return;}if('importSave'in d){$('import-file').click();return;}if('toggleSound'in d){ui.sound=!ui.sound;state.settings.sound=ui.sound;save();playChime();b.textContent=ui.sound?'♪ เสียงเปิด':'♪ เสียงปิด';return;}if('newGame'in d){$('settings-dialog').close();confirmAction('เริ่มกิลด์ใหม่?', 'เซฟปัจจุบันจะถูกแทนที่ เริ่มจากบ้านหลังเล็กและสมาชิกชุดแรก',()=>{state=createGame();ui={...ui,tab:'quests',questId:null,memberId:null,facilityId:null,missionId:null,selected:new Set(),tutorial:true,paused:false,speed:1,sound:!!state.settings.sound};cancelBuild();renderer?.setState(state);renderer?.resetView?.();save();syncUI();toast('ยินดีต้อนรับกลับสู่กิลด์ใบอ่อน');});}});
$('pause-button').addEventListener('click',()=>{ui.paused=!ui.paused;syncHUD();});
$('zoom-in').addEventListener('click',()=>{ui.zoom=Math.min(2.2,ui.zoom+.15);renderer?.setZoom(ui.zoom);});$('zoom-out').addEventListener('click',()=>{ui.zoom=Math.max(.55,ui.zoom-.15);renderer?.setZoom(ui.zoom);});$('home-view').addEventListener('click',()=>{ui.zoom=1;renderer?.resetView?.();renderer?.setZoom(1);});
document.addEventListener('keydown',event=>{if(event.target.matches('input,select,textarea,button')||document.querySelector('dialog[open]'))return;if(event.code==='Space'){event.preventDefault();ui.paused=!ui.paused;syncHUD();}if(['1','2','4'].includes(event.key)){ui.speed=Number(event.key);state.settings.speed=ui.speed;ui.paused=false;syncHUD();save();}if(event.key==='Escape'){cancelBuild();}if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"]'))event.target.click();});
let lastFrame=performance.now(),uiTimer=0,saveTimer=0,seenLog=state.log[0];
function frame(now){const dt=Math.max(0,Math.min((now-lastFrame)/1000,.25));lastFrame=now;if(!document.hidden&&!ui.paused&&!document.querySelector('dialog[open]')){tick(state,dt*ui.speed);renderer?.setState(state);uiTimer+=dt;saveTimer+=dt;if(state.log[0]!==seenLog){const latest=state.log[0];if(latest?.type!=='daily'){toast(latest.text);playChime();}seenLog=state.log[0];}if(uiTimer>.9){syncHUD();if(!document.activeElement?.matches('select')&&(ui.missionId||ui.questId||ui.tab==='journal'||ui.tab==='members'||ui.tab==='build'||ui.tab==='workshop'))syncUI();uiTimer=0;}if(saveTimer>12){save();saveTimer=0;}}if(ui.missionId)drawMissionScene();requestAnimationFrame(frame);}
function drawMissionScene(){const canvas=$('mission-scene');if(!canvas||!ui.missionId)return;const mission=state.missions.find(m=>m.id===ui.missionId);const quest=QUESTS.find(q=>q.id===mission?.questId);if(mission&&quest)drawBattleScene(canvas,mission,quest,state,{paused:ui.paused||document.hidden,time:performance.now()/1000});}

syncUI();save();requestAnimationFrame(frame);if(loadNotice)setTimeout(()=>toast(loadNotice,true),800);document.addEventListener('visibilitychange',()=>{lastFrame=performance.now();if(document.hidden)save();});window.addEventListener('pagehide',()=>save());
// Read-only diagnostics, useful for reproducible bug reports without a cheat menu.
window.guildDebug={getState:()=>JSON.parse(serializeGame(state)),getScenePoint:(x,y)=>{const r=renderer.worldToScreen(x*32,y*32),b=$('guild-world').getBoundingClientRect();return{x:b.left+r.x*b.width/renderer.width,y:b.top+r.y*b.height/renderer.height};},getSnapshot:()=>({rank:state.rank,day:state.day,members:state.members.length,quests:state.completedQuests,finished:state.story?.finished})};
</script>
